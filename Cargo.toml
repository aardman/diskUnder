[package]
name = "diskunder"
version = "5.5.6"
edition = "2021"

[dependencies]
blake3    = "1.5"
chrono    = "0.4"
crossterm = "0.28"   # v3.0+
md5       = "0.7"
rayon     = "1.8"
ratatui   = "0.28"   # v3.0+
rusqlite  = { version = "0.30", features = ["bundled"] }
clap      = { version = "4.5", features = ["derive"] }
globset   = "0.4"
libc      = "0.2"
walkdir   = "2.4"
